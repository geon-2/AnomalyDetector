# mappings/hdfs.yaml
_meta:
  source: hdfs
  schema: distributed.yaml
  description: "HDFS_v1/v2/v3 로그 → 정규화 스키마 매핑"

defaults:
  log.source: hdfs
  log.category: distributed_system

field_mapping:
  Date: "@timestamp"        # yymmdd
  Time: "@timestamp"        # HHMMSS
  Level: log.level
  Component: process.name
  Content: message

timestamp:
  fields: [Date, Time]
  format: "%y%m%d %H%M%S"
  timezone: UTC

level_mapping:
  INFO: info
  WARN: warn
  WARNING: warn
  ERROR: error
  SEVERE: error
  DEBUG: debug
  FATAL: fatal

pattern_extraction:
  - field: distributed.block_id
    pattern: "blk_[-]?\\d+"

  - field: distributed.node_id
    pattern: "(\\d+\\.\\d+\\.\\d+\\.\\d+:\\d+)"

  - field: distributed.operation
    patterns:
      - pattern: "Receiving block"
        value: write
      - pattern: "Transmitting block"
        value: read
      - pattern: "Deleting block"
        value: delete
      - pattern: "Receiving replicated block"
        value: replicate

conditional:
  - condition:
      field: Component
      contains: "DataNode"
    set:
      process.role: datanode

  - condition:
      field: Component
      contains: "NameNode"
    set:
      process.role: namenode
