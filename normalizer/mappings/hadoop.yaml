# mappings/hadoop.yaml
_meta:
  source: hadoop
  schema: distributed.yaml
  description: "Hadoop MapReduce job 로그 → 정규화 스키마 매핑"

defaults:
  log.source: hadoop
  log.category: distributed_system

field_mapping:
  Date: "@timestamp"        # yymmdd 또는 yyyy-mm-dd 등 실제 포맷에 맞게 조정
  Time: "@timestamp"
  Level: log.level
  Component: process.name
  Content: message

timestamp:
  fields: [Date, Time]
  format: "%y%m%d %H%M%S"   # 실제 포맷 다르면 여기만 바꾸면 됨
  timezone: UTC

level_mapping:
  INFO: info
  WARN: warn
  WARNING: warn
  ERROR: error
  FATAL: fatal
  DEBUG: debug

pattern_extraction:
  - field: distributed.job_id
    pattern: "job_\\d+_\\d+"

  - field: distributed.task_id
    pattern: "task_\\d+_\\d+_[m|r]_\\d+"

  - field: distributed.operation
    patterns:
      - pattern: "Submitting tokens for job"
        value: schedule
      - pattern: "Launching task"
        value: launch
      - pattern: "Task attempt .* done"
        value: other
      - pattern: "reporting task status"
        value: heartbeat
