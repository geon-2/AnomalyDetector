# mappings/openstack.yaml
_meta:
  source: openstack
  schema: distributed.yaml
  description: "OpenStack 인프라 로그 → 정규화 스키마 매핑"

defaults:
  log.source: openstack
  log.category: distributed_system

field_mapping:
  Date: "@timestamp"
  Time: "@timestamp"
  Level: log.level
  Component: process.name
  Host: host.name
  Content: message

timestamp:
  fields: [Date, Time]
  format: "%Y-%m-%d %H:%M:%S.%f"
  timezone: UTC

level_mapping:
  INFO: info
  WARN: warn
  WARNING: warn
  ERROR: error
  CRITICAL: fatal
  DEBUG: debug

pattern_extraction:
  - field: distributed.container_id
    pattern: "instance-([0-9a-fA-F\\-]+)"

  - field: distributed.operation
    patterns:
      - pattern: "Starting.*instance"
        value: launch
      - pattern: "Deleting.*instance"
        value: delete
      - pattern: "Rebuilding.*instance"
        value: allocate
      - pattern: "Creating volume"
        value: allocate
      - pattern: "Deleting volume"
        value: delete
      - pattern: "Scheduling"
        value: schedule정
