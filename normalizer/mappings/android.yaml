_meta:
  source: android
  schema: mobile.yaml
  description: "Android_v1/v2 로그 매핑"

defaults:
  log.source: android
  log.category: mobile

field_mapping:
  Date: "@timestamp"
  Time: "@timestamp"
  PID: process.pid
  Level: log.level
  Component: android.component
  Tag: android.tag
  Content: message

timestamp:
  fields: [Date, Time]
  format: "%m-%d %H:%M:%S.%f"   # 실제 형식에 맞게 조정
  timezone: local

level_mapping:
  V: debug
  D: debug
  I: info
  W: warn
  E: error
  F: fatal

pattern_extraction:
  - field: android.app.package
    pattern: "([a-zA-Z0-9_\\.]+/[A-Za-z0-9_\\.]+)"
