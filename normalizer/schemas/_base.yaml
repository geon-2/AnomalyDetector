# schemas/_base.yaml
_meta:
  version: "1.0.0"
  description: "LogHub 전체 로그에 공통으로 적용되는 최소 스키마"

required:
  - "@timestamp"
  - log

fields:
  "@timestamp":
    type: datetime
    format: "ISO8601"
    description: "이벤트 발생 시간"
    required: true

  message:
    type: string
    description: "원본 또는 정규화된 로그 메시지"
    required: false

  log:
    type: object
    description: "로그 메타 정보"
    required: true
    fields:
      source:
        type: enum
        values:
          - hdfs
          - hadoop
          - spark
          - zookeeper
          - openstack
          - bgl
          - hpc
          - thunderbird
          - windows
          - linux
          - mac
          - apache
          - openssh
          - android
          - healthapp
          - proxifier
        description: "LogHub 데이터셋 이름"
        required: true

      category:
        type: enum
        values:
          - distributed_system
          - supercomputer
          - operating_system
          - server_application
          - mobile
          - standalone
        description: "시스템 카테고리"
        required: false

      level:
        type: enum
        values: [debug, info, warn, error, fatal, unknown]
        description: "정규화된 로그 레벨"
        required: true

  event:
    type: object
    description: "이벤트 식별/라벨 정보"
    required: false
    fields:
      id:
        type: string
        description: "이벤트 고유 ID (해시 등)"
      template_id
