apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-collector
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      containers:
      - name: log-collector
        image: log-collector:latest
        imagePullPolicy: Never
        env:
        - name: LOG_FILE
          valueFrom:
            configMapKeyRef:
              name: anomaly-detector-config
              key: LOG_FILE
        - name: NORMALIZER_URL
          value: "http://normalizer-service:5001/normalize"
        - name: BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: anomaly-detector-config
              key: BATCH_SIZE
        - name: DELAY
          valueFrom:
            configMapKeyRef:
              name: anomaly-detector-config
              key: DELAY
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: normalizer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: normalizer
  template:
    metadata:
      labels:
        app: normalizer
    spec:
      containers:
      - name: normalizer
        image: normalizer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001
        env:
        - name: DETECTOR_URL
          value: "http://detector-service:5002/analyze"

---
apiVersion: v1
kind: Service
metadata:
  name: normalizer-service
  namespace: default
spec:
  selector:
    app: normalizer
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: detector
  template:
    metadata:
      labels:
        app: detector
    spec:
      containers:
      - name: detector
        image: detector:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5002
        env:
        - name: VISUALIZER_URL
          value: "http://visualizer-service:8502/event"
        - name: MODEL_DIR
          value: "/models"
        - name: MAX_SEQUENCE_LENGTH
          valueFrom:
            configMapKeyRef:
              name: anomaly-detector-config
              key: MAX_SEQUENCE_LENGTH
        - name: MODEL_TYPE
          valueFrom:
            configMapKeyRef:
              name: anomaly-detector-config
              key: MODEL_TYPE

---
apiVersion: v1
kind: Service
metadata:
  name: detector-service
  namespace: default
spec:
  selector:
    app: detector
  ports:
  - protocol: TCP
    port: 5002
    targetPort: 5002
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualizer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visualizer
  template:
    metadata:
      labels:
        app: visualizer
    spec:
      containers:
      - name: visualizer
        image: visualizer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8502
        resources:
          limits:
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"

---
apiVersion: v1
kind: Service
metadata:
  name: visualizer-service
  namespace: default
spec:
  selector:
    app: visualizer
  ports:
  - protocol: TCP
    port: 8502
    targetPort: 8502
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
    spec:
      containers:
      - name: llm-service
        image: llm-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "10Gi"
            cpu: "4"
          requests:
            memory: "8Gi"
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: default
spec:
  selector:
    app: llm-service
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-queue
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-queue
  template:
    metadata:
      labels:
        app: llm-queue
    spec:
      containers:
      - name: llm-queue
        image: llm-queue:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 9001