apiVersion: v1
kind: Service
metadata:
  name: normalizer-service
  namespace: default
spec:
  selector:
    app: normalizer
  ports:
  - protocol: TCP
    port: 5001
    targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: detector-service
  namespace: default
spec:
  selector:
    app: detector
  ports:
  - protocol: TCP
    port: 5002
    targetPort: 5002
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: visualizer-service
  namespace: default
spec:
  selector:
    app: visualizer
  ports:
  - name: api
    protocol: TCP
    port: 8502
    targetPort: 8502
  - name: dashboard
    protocol: TCP
    port: 8501
    targetPort: 8501
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: default
spec:
  selector:
    app: llm-service
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
