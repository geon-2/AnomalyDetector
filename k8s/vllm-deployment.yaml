apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-service
  template:
    metadata:
      labels:
        app: vllm-service
    spec:
      containers:
      - name: vllm-service
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: HF_HOME
          value: /models/hf_cache
        - name: TRANSFORMERS_CACHE
          value: /models/hf_cache
        command:
        - "python3"
        - "-m"
        - "vllm.entrypoints.openai.api_server"
        - "--model"
        - "meta-llama/Meta-Llama-3-8B-Instruct"
        - "--enable-lora"
        - "--max-lora-rank"
        - "16"
        - "--port"
        - "8000"
        - "--host"
        - "0.0.0.0"
        - "--dtype"
        - "auto"
        - "--max-model-len"
        - "2048"
        volumeMounts:
        - name: lora-adapter
          mountPath: /lora
          readOnly: true
        resources:
          limits:
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: lora-adapter
        hostPath:
          path: /Users/gunlee/Development/MSA/AnomalyDetector/models/llm/llama3-ecs-schema-generator
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: default
spec:
  selector:
    app: vllm-service
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
